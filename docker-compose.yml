services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autowriter
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5413:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    environment:
      APP_ENV: prod
      APP_SECRET_KEY: change-me-in-prod
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/autowriter
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE:-}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      ARTIFACTS_DIR: /data/artifacts
    depends_on:
      - db
      - redis
    volumes:
      - artifacts:/data/artifacts
    ports:
      - "8413:8000"

  worker:
    build: ./backend
    environment:
      APP_ENV: prod
      APP_SECRET_KEY: change-me-in-prod
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/autowriter
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE:-}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      ARTIFACTS_DIR: /data/artifacts
      SKIP_MIGRATIONS: "1"
    depends_on:
      - db
      - redis
    volumes:
      - artifacts:/data/artifacts
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info"]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3413:80"

volumes:
  db_data:
  redis_data:
  artifacts:
