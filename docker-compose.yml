x-backend-env: &backend-env
  AUTO_WRITER_APP_ENV: prod
  AUTO_WRITER_SECRET_KEY: ${AUTO_WRITER_SECRET_KEY:-change-me-in-prod}
  AUTO_WRITER_SECRET_KEY_FILE: ${AUTO_WRITER_SECRET_KEY_FILE:-}
  AUTO_WRITER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/autowriter
  AUTO_WRITER_DATABASE_URL_FILE: ${AUTO_WRITER_DATABASE_URL_FILE:-}
  AUTO_WRITER_REDIS_URL: redis://redis:6379/0
  AUTO_WRITER_REDIS_URL_FILE: ${AUTO_WRITER_REDIS_URL_FILE:-}
  AUTO_WRITER_DEEPSEEK_API_KEY: ${AUTO_WRITER_DEEPSEEK_API_KEY:-}
  AUTO_WRITER_DEEPSEEK_API_KEY_FILE: ${AUTO_WRITER_DEEPSEEK_API_KEY_FILE:-}
  AUTO_WRITER_DEEPSEEK_BASE_URL: ${AUTO_WRITER_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  AUTO_WRITER_DEEPSEEK_MODEL: ${AUTO_WRITER_DEEPSEEK_MODEL:-deepseek-chat}
  AUTO_WRITER_ARTIFACTS_DIR: /data/artifacts

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autowriter
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5413:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    environment:
      <<: *backend-env
    depends_on:
      - db
      - redis
    volumes:
      - artifacts:/data/artifacts
    ports:
      - "8413:8000"

  worker:
    build: ./backend
    environment:
      <<: *backend-env
      SKIP_MIGRATIONS: "1"
    depends_on:
      - db
      - redis
    volumes:
      - artifacts:/data/artifacts
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info"]

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3413:80"

volumes:
  db_data:
  redis_data:
  artifacts:
